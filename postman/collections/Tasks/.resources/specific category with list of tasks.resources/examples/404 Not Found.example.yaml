$kind: http-example
name: '404 Not Found'
request:
  url: 'http://localhost:8000/api/tasks/category/9999/'
  method: GET
response:
  statusCode: 404
  statusText: 'Not Found'
  headers:
    - key: Content-Type
      value: 'text/html; charset=utf-8'
  body:
    type: html
    content: |-

      <!doctype html>
      <html lang="en">
      <head>
        <title>Not Found</title>
      </head>
      <body>
        <h1>Not Found</h1><p>The requested resource was not found on this server.</p>
      </body>
      </html>
order: 2000
