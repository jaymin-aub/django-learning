$kind: http-example
name: '200 OK'
request:
  url: 'http://localhost:8000/health/'
  method: GET
response:
  statusCode: 200
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
          "status": "ok"
      }
order: 1000
