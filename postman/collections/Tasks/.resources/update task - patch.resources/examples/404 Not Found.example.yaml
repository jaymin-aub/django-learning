$kind: http-example
name: '404 Not Found'
request:
  url: 'http://localhost:8000/api/tasks/drf/9999/update/'
  method: PATCH
  body:
    type: json
    content: |-
      {
          "completed": true
      }
response:
  statusCode: 404
  statusText: 'Not Found'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
          "error": "Task not found"
      }
order: 2000
