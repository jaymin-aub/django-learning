$kind: http-example
name: '200 OK - mark as completed'
request:
  url: 'http://localhost:8000/api/tasks/drf/1/update/'
  method: PATCH
  body:
    type: json
    content: |-
      {
          "completed": true
      }
response:
  statusCode: 200
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: 'application/json'
  body:
    type: json
    content: |-
      {
          "id": 1,
          "title": "Prepare weekly report",
          "description": "Collect numbers from the team and send the report to the manager",
          "completed": true,
          "created_at": "2026-10-16T07:24:17.110268Z",
          "category": 1
      }
order: 1000
