$kind: http-request
url: '{{base_url}}/api/tasks/drf-apiview-fbv/category/{{category_id}}'
method: GET
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", () => pm.response.to.have.status(200));
      pm.test("Returns the right item", () => pm.expect(String(pm.response.json().id)).to.eql(pm.collectionVariables.get("category_id")));
order: 3000
