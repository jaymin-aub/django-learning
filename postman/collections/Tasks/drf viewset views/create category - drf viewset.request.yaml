$kind: http-request
url: '{{base_url}}/api/tasks/viewset/categories'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "title": "Work"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201 Created", () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test("Response has an id", () => pm.expect(body.id).to.be.a("number"));
      // Save the new id so the next requests use it
      pm.collectionVariables.set("category_id", String(body.id));
order: 1000
