$kind: http-request
url: '{{base_url}}/api/tasks/drf-apiview/category/{{category_id}}'
method: PUT
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "title": "Home"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", () => pm.response.to.have.status(200));
      pm.test("Title was updated", () => pm.expect(pm.response.json().title).to.eql("Home"));
order: 4000
