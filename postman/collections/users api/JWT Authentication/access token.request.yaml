$kind: http-request
method: POST
url: '{{base_url}}/api/users/token/'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "newuser",
      "password": "strongpass123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("returns 200", () => pm.response.to.have.status(200));
      pm.test("returns access and refresh tokens", () => {
        const body = pm.response.json();
        pm.expect(body.access).to.be.a("string").and.not.empty;
        pm.expect(body.refresh).to.be.a("string").and.not.empty;
        pm.collectionVariables.set("access_token", body.access);
        pm.collectionVariables.set("refresh_token", body.refresh);
      });
    language: text/javascript
examples: './.resources/access token.resources/examples'
