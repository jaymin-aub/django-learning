$kind: http-example
request:
  url: '{{base_url}}/api/users/token/'
  method: POST
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "detail": "No active account found with the given credentials"
      }
order: 2000
